const BP=C.bgPixel,BW=Math.ceil(W/BP),BH=Math.ceil(H/BP),TILT=0.32;  // TILT: orbit ellipses viewed at an angle
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+0.5)/16);
const bgc=document.createElement('canvas');bgc.width=BW;bgc.height=BH;
const bctx=bgc.getContext('2d'),bimg=bctx.createImageData(BW,BH),fb=new Uint32Array(bimg.data.buffer);
const u32=h=>{const n=parseInt(h.slice(1),16);return(0xff000000|(n&255)<<16|n&0xff00|n>>16)>>>0;};  // little-endian RGBA
function rng32(a){return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
// Static layer: dithered nebula, star with dithered corona, dotted orbits, asteroid belt
function buildEnv(e){
  const R=rng32(e.seed),buf=new Uint32Array(BW*BH),s=e.sun,K=e.neb.length,
    neb=e.neb.map(u32),space=u32(e.space),core=s.c.map(u32),glow=s.glow.map(u32),blobs=[];
  for(let i=0;i<6;i++)blobs.push({x:R()*BW,y:R()*BH,rx:20+R()*60,ry:10+R()*30,a:0.3+R()*0.6});
  for(let y=0;y<BH;y++)for(let x=0;x<BW;x++){
    const t=BAYER[(y&3)*4+(x&3)];let n=(R()-0.5)*0.12;
    for(const b of blobs){const dx=(x-b.x)/b.rx,dy=(y-b.y)/b.ry;n+=b.a*Math.exp(-dx*dx-dy*dy);}
    const ni=Math.floor(clamp(n,0,1)*K*0.999+t);let col=ni<=0?space:neb[Math.min(ni,K)-1];
    const d=Math.hypot(x-s.x,y-s.y);
    if(d<s.r)col=core[clamp(Math.floor(d/s.r*3+t-0.5),0,2)];
    else{const g=1-(d-s.r)/(s.r*1.6),gi=Math.floor(g*2+t);if(g>0&&gi>0)col=glow[Math.min(gi,2)-1];}
    buf[y*BW+x]=col;
  }
  const put=(x,y,c)=>{x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<BW&&y<BH&&Math.hypot(x-s.x,y-s.y)>s.r)buf[y*BW+x]=c;};
  const oc=u32(e.orbit);
  for(const P of e.planets){const n=Math.floor(P.o*1.2);for(let i=0;i<n;i+=2){const a=i/n*6.283;put(s.x+Math.cos(a)*P.o,s.y+Math.sin(a)*P.o*TILT,oc);}}
  if(e.belt){const B=e.belt,bc=B.c.map(u32);
    for(let i=0;i<B.n;i++){const a=R()*6.283,o=B.o+(R()-0.5)*2*B.w;put(s.x+Math.cos(a)*o,s.y+Math.sin(a)*o*TILT,bc[i&1]);}}
  e.buf=buf;e.cols={orbit:oc};
  for(const P of e.planets){P.cc=P.c.map(u32);if(P.ring)P.rc=u32(P.ring);if(P.moon)P.moon.cc=P.moon.c.map(u32);}
}
ENVS.forEach(buildEnv);
// Shaded pixel sphere; the light comes from the star, and from behind for bodies on the near half
// of their orbit, so planets show phases. `hide` skips pixels covered by the star (far-side bodies).
function plotBody(e,cx,cy,r,cc,bands,near,hide){
  const s=e.sun,m=Math.hypot(s.x-cx,s.y-cy)||1,lx=(s.x-cx)/m*0.8,ly=(s.y-cy)/m*0.8,lz=near?-0.6:0.6;
  cx=Math.round(cx);cy=Math.round(cy);
  for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){
    if(i*i+j*j>r*r+r*0.8)continue;
    const x=cx+i,y=cy+j;if(x<0||y<0||x>=BW||y>=BH)continue;
    if(hide&&Math.hypot(x-s.x,y-s.y)<s.r)continue;
    const nx=i/(r+0.5),ny=j/(r+0.5),nz=Math.sqrt(Math.max(0,1-nx*nx-ny*ny));
    let k=Math.floor(clamp(nx*lx+ny*ly+nz*lz+0.15,0,1)*2.999+BAYER[(y&3)*4+(x&3)]-0.4);
    if(bands&&((j+r)>>1)&1)k--;
    fb[y*BW+x]=cc[clamp(k,0,2)];
  }
}
function plotRing(e,cx,cy,P,front){
  const n=P.r*14;
  for(let i=0;i<n;i++){const a=i/n*6.283,sn=Math.sin(a);if((sn>=0)!==front)continue;
    const x=Math.round(cx+Math.cos(a)*P.r*2.1),y=Math.round(cy+sn*P.r*0.55);
    if(x>=0&&y>=0&&x<BW&&y<BH)fb[y*BW+x]=P.rc;}
}
function drawEnv(e,t,alpha){
  fb.set(e.buf);const s=e.sun;
  const order=e.planets.map(P=>{const a=P.a+t*P.sp;return{P,a,sn:Math.sin(a)};}).sort((u,v)=>u.sn-v.sn);
  for(const{P,a,sn}of order){
    const cx=s.x+Math.cos(a)*P.o,cy=s.y+sn*P.o*TILT,near=sn>0,hide=!near;
    let mx,my,mnear;
    if(P.moon){const M=P.moon,ma=t*M.sp;mx=cx+Math.cos(ma)*M.d;my=cy+Math.sin(ma)*M.d*TILT;mnear=Math.sin(ma)>0;
      if(!mnear)plotBody(e,mx,my,M.r,M.cc,0,near,hide);}
    if(P.ring&&!hide)plotRing(e,cx,cy,P,false);
    plotBody(e,cx,cy,P.r,P.cc,P.bands,near,hide);
    if(P.ring&&!hide)plotRing(e,cx,cy,P,true);
    if(P.moon&&mnear)plotBody(e,mx,my,P.moon.r,P.moon.cc,0,near,hide);
  }
  bctx.putImageData(bimg,0,0);
  ctx.globalAlpha=alpha;ctx.imageSmoothingEnabled=false;ctx.drawImage(bgc,0,0,BW*BP,BH*BP);ctx.globalAlpha=1;
}

function startGame(){reset();pressQ=true;}
function goMenu(){
  ALL.forEach(clear);timed.length=0;boss.on=inBoss=false;flight=1;speed=60;
  envCur=C.levels[0].env;envPrev=-1;envFade=1;toastT=envToastT=unlockT=0;menuSel=0;state='menu';
}
function openHangar(){hangarSel=ship;state='hangar';}
function equip(){
  if(!unlocked(hangarSel)){lockFlash=0.5;return;}
  ship=hangarSel;try{localStorage.setItem('voidRunnerShip',ship);}catch(e){}
}
function togglePause(){if(state==='play')state='pause';else if(state==='pause')state='play';}
// UI layout (logical coords), shared by drawing and pointer hit-testing
const inR=(r,x,y)=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;
const MENU_ITEMS=[{label:'PLAY',act:()=>startIntro()},{label:'HANGAR',act:openHangar}];
const menuBtn=i=>({x:W/2-120,y:318+i*54,w:240,h:42});
const slotR=i=>({x:65+i*170,y:104,w:150,h:136});
const BACK_BTN={x:40,y:462,w:150,h:42},EQUIP_BTN={x:W-190,y:462,w:150,h:42},
  RETRY_BTN={x:W/2-90,y:H/2+66,w:180,h:40},MENU_BTN={x:W/2-90,y:H/2+114,w:180,h:40},   // game over: stacked, ↑/↓ to choose
  PMENU_BTN={x:W/2-75,y:H/2+70,w:150,h:42};
const THRUST_KEYS={Space:1,ArrowUp:1,KeyW:1};
addEventListener('keydown',e=>{
  const k=e.code,go=!e.repeat;
  if(THRUST_KEYS[k]||k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowRight')e.preventDefault();
  if(THRUST_KEYS[k])keyThrust=true;
  if(state==='play'||state==='pause'){
    if(THRUST_KEYS[k]&&go)press();
    else if(k==='KeyP'||k==='Escape')togglePause();
    else if(k==='KeyM'&&state==='pause')goMenu();
  }else if(state==='menu'){
    if(k==='ArrowUp'||k==='KeyW')menuSel=(menuSel+MENU_ITEMS.length-1)%MENU_ITEMS.length;
    else if(k==='ArrowDown'||k==='KeyS')menuSel=(menuSel+1)%MENU_ITEMS.length;
    else if((k==='Enter'||k==='Space')&&go)MENU_ITEMS[menuSel].act();
  }else if(state==='hangar'){
    if(k==='ArrowLeft'||k==='KeyA')hangarSel=Math.max(0,hangarSel-1);
    else if(k==='ArrowRight'||k==='KeyD')hangarSel=Math.min(SHIPS.length-1,hangarSel+1);
    else if((k==='Enter'||k==='Space')&&go)equip();
    else if(k==='Escape'||k==='Backspace')state='menu';
  }else if(state==='intro'){
    if((k==='Enter'||k==='Space')&&go)advanceIntro();
    else if(k==='Escape'&&go)startGame();
  }else if(state==='outro'){
    if((k==='Enter'||k==='Space'||k==='Escape')&&go&&outroT>OUT.crack)beginPlay();
  }else if(state==='over'){
    if(k==='ArrowUp'||k==='KeyW'||k==='ArrowDown'||k==='KeyS')overSel^=1;
    else if((k==='Enter'||k==='Space')&&go&&overT>0.6){if(overSel)goMenu();else startGame();}
    else if(k==='Escape'||k==='KeyM')goMenu();
  }
  syncInput();
});
addEventListener('keyup',e=>{if(THRUST_KEYS[e.code]){keyThrust=false;syncInput();}});
// play: the pause button (top-right of the HUD) toggles pause, any other press thrusts.
// Menus are tap/click driven; a press that starts a run stays held as thrust.
const PAUSE_BTN={x:W-50,y:4,w:40,h:28};
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  const x=(e.clientX*dpr-ox)/sc,y=(e.clientY*dpr-oy)/sc,b=PAUSE_BTN,hold=()=>{ptrs.add(e.pointerId);syncInput();};
  if(state==='play'||state==='pause'){
    if(x>b.x-10&&y<b.y+b.h+10){togglePause();return;}
    if(state==='pause'&&inR(PMENU_BTN,x,y)){goMenu();return;}
    hold();press();
  }else if(state==='menu'){
    MENU_ITEMS.forEach((m,i)=>{if(inR(menuBtn(i),x,y)){menuSel=i;m.act();}});
  }else if(state==='intro'){
    if(inR(SKIP_BTN,x,y)){startGame();return;}
    hold();advanceIntro();
  }else if(state==='outro'){
    hold();if(outroT>OUT.crack)beginPlay();
  }else if(state==='hangar'){
    if(inR(BACK_BTN,x,y)){state='menu';return;}
    if(inR(EQUIP_BTN,x,y)){equip();return;}
    for(let i=0;i<SHIPS.length;i++)if(inR(slotR(i),x,y)){if(hangarSel===i)equip();else hangarSel=i;}
  }else if(state==='over'){
    if(overT<=0.6)return;
    if(inR(MENU_BTN,x,y)){overSel=1;goMenu();return;}
    overSel=0;hold();startGame();   // RETRY, or a tap anywhere else
  }
});
function ptrEnd(e){ptrs.delete(e.pointerId);syncInput();}
addEventListener('pointerup',ptrEnd);addEventListener('pointercancel',ptrEnd);
addEventListener('blur',()=>{ptrs.clear();keyThrust=false;syncInput();if(state==='play')state='pause';});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')state='pause';});

// ---- Spawning
function burst(x,y,col,n,spd){
  for(let i=0;i<n;i++){const q=take(parts);if(!q)return;
    const a=Math.random()*6.283,s=rand(0.3,1)*spd;
    q.x=x;q.y=y;q.vx=Math.cos(a)*s;q.vy=Math.sin(a)*s;q.l=q.m=rand(0.3,0.7);q.c=col;}
}
function shoot(x,y,a){const b=take(bullets);if(!b)return;
  b.x=x;b.y=y;b.vx=Math.cos(a)*C.bulletSpeed;b.vy=Math.sin(a)*C.bulletSpeed;}
function pickType(){let r=Math.random()*WTOT;
  for(let i=0;i<CARDS.length;i++){r-=C.cardWeight[CARDS[i].k];if(r<0)return i;}return 0;}
function spawnCard(x,y){const c=take(cards);if(!c)return;
  c.x=x;c.y=clamp(y,C.ceil+8,C.floor-C.cardH-8);c.t=Math.random()*6;c.type=pickType();
  c.vs=rand(C.cardBounceVy[0],C.cardBounceVy[1]);c.vy=Math.random()<0.5?-c.vs:c.vs;c.vx=-Math.max(speed*0.75,60);c.flash=0;}
function spawnTower(d){const q=take(towers);if(!q)return;
  const gh=rand(lerp(C.gapStart[0],C.gapEnd[0],d),lerp(C.gapStart[1],C.gapEnd[1],d));
  const lo=C.ceil+gh/2+20,hi=C.floor-gh/2-20;
  // limit how far the gap moves from the previous one so it stays reachable
  lastGapC=clamp(lastGapC+rand(-C.gapShift,C.gapShift),lo,hi);
  q.x=W+10;q.gy=lastGapC-gh/2;q.gh=gh;q.seed=randInt(0,999);q.neon=NEON[q.seed%3];}
// 1 at the start of a ramping level, falling to 0 once it has fully ramped up
const rampK=()=>{const L=C.levels[level];return L.ramp?Math.max(0,1-levelT/L.ramp):0;};
const fireInterval=(K,d)=>lerp(K.fireEvery[0],K.fireEvery[1],d)*rand(0.8,1.2)*(1+0.8*rampK());
function newEnemy(kind,slot,d){const e=take(enemies);if(!e)return null;const K=C[kind];
  Object.assign(e,{kind,K,slot,hp:K.hp,w:K.w,h:K.h,flash:0,t:Math.random()*6,fireT:rand(0.6,1.2)*fireInterval(K,d),windup:0,dashLeft:0,dashT:0,leaving:false});
  return e;}
// Enemies arrive one at a time and never scroll past: each takes a free hover slot on the right.
// New ones keep arriving while old ones live, so unkilled enemies stack up to the level's `max`.
function spawnEnemy(L,d){
  const used=[];let n=0;
  for(const e of enemies)if(e.on&&!e.leaving){n++;if(e.kind===L.kind)used[e.slot]=1;}
  if(n>=(L.ramp?Math.min(L.max,1+Math.floor((1-rampK())*L.max)):L.max))return;
  firstPending=false;
  if(L.kind==='drone'){
    const s=C.droneSlots.findIndex((_,i)=>!used[i]);if(s<0)return;
    const e=newEnemy('drone',s,d);if(!e)return;
    e.tx=C.droneSlots[s][0];e.ty=C.droneSlots[s][1];e.x=W+40;e.y=e.ty;e.pts=L.points;e.c=L.col;e.look=L.look;
  }else{
    const s=C.bruteSlotsX.findIndex((_,i)=>!used[i]);if(s<0)return;
    const e=newEnemy('brute',s,d);if(!e)return;
    e.tx=C.bruteSlotsX[s];e.x=W+60;e.y=clamp(p.y,C.ceil+4,C.floor-e.h-4);
  }
}
// sdt advances with scrolling (slowed by Slow Time, frozen while the flight halts for the boss)
function spawn(sdt,d){
  if(inBoss)return;
  if((towerT-=sdt)<=0){towerT=lerp(C.towerEvery[0],C.towerEvery[1],d)*rand(0.85,1.15);spawnTower(d);}
  if((enemyT-=sdt)<=0){const L=C.levels[level];enemyT=L.every*rand(0.85,1.15);spawnEnemy(L,d);}
  if((cardT-=sdt)<=0){cardT=rand(C.cardEvery[0],C.cardEvery[1]);spawnCard(W+30,rand(C.ceil+30,C.floor-90));}
}

// ---- Update
function updateStars(dt){
  for(const L of LAYERS){const v=speed*L.f*dt;
    for(let i=0;i<L.n;i++){if((L.x[i]-=v)<0){L.x[i]+=W;L.y[i]=Math.random()*H;}}}
}
function updatePlayer(dt){
  if(pressQ){p.vy=-C.thrustImpulse;pressQ=false;}
  p.vy+=C.gravity*dt;if(held)p.vy-=C.holdLift*dt;
  p.vy=Math.max(-C.maxRise,Math.min(C.maxFall,p.vy));
  p.y+=p.vy*dt;
  if(p.inv>0)p.inv-=dt;
  // floor/ceiling are lethal; if a hit was absorbed, bounce back into the playfield
  if(p.y<C.ceil){if(hurt())return;p.y=C.ceil;p.vy=150;}
  else if(p.y+C.playerH>C.floor){if(hurt())return;p.y=C.floor-C.playerH;p.vy=-C.thrustImpulse;}
  if((p.fireT-=dt)<=0){
    p.fireT=(has('rapid')?C.rapidCooldown:C.fireCooldown)*(SH().fire||1);
    const x=p.x+C.playerW,y=p.y+C.playerH/2-1.5;
    const n=(has('double')?1:0)+(SH().double?1:0);   // 0: single, 1: twin, 2: twin + centre
    if(n){shoot(x,y,-C.doubleSpread);shoot(x,y,C.doubleSpread);}
    if(n!==1)shoot(x,y,0);
  }
}
function updateTimed(dt){
  for(let i=timed.length-1;i>=0;i--)if((timed[i].t-=dt)<=0)timed.splice(i,1);
  if(toastT>0)toastT-=dt;
}
function enemyShot(x,y,vx,vy,w,h,c,solid){const b=take(ebullets);if(!b)return;
  b.x=x-w/2;b.y=y-h/2;b.vx=vx;b.vy=vy;b.w=w;b.h=h;b.c=c;b.solid=!!solid;}  // solid: can't be shot down
function startBoss(){const B=C.boss;
  Object.assign(boss,{on:true,x:W+40,y:H/2-B.h/2,w:B.w,h:B.h,hp:B.hp,flash:0,t:0,colT:2,orbT:B.orbEvery,gapC:(C.ceil+C.floor)/2,drops:0});}
// One maze column: a wall of blocks with a gap that shifts a limited amount from the previous gap,
// plus a dead-end spur trailing from the wall at a height the player never needs to cross.
function mazeColumn(){
  const B=C.boss,x=boss.x-14,s=B.cell,v=-B.mazeSpeed,gh=B.gap,prev=boss.gapC,col='#00e5ff';
  boss.gapC=clamp(prev+rand(-B.gapShift,B.gapShift),C.ceil+gh/2+6,C.floor-gh/2-6);
  const g0=boss.gapC-gh/2,g1=boss.gapC+gh/2;
  for(let y=C.ceil+7;y<C.floor;y+=s)if(y+6<g0||y-6>g1)enemyShot(x,y,v,0,12,12,col,1);
  const a=Math.min(prev,boss.gapC)-gh/2-20,b=Math.max(prev,boss.gapC)+gh/2+20;
  for(let i=0;i<4;i++){const y=C.ceil+7+randInt(0,(C.floor-C.ceil-14)/s)*s;
    if(y<a||y>b){for(let k=1;k<=5;k++)enemyShot(x-k*s,y,v,0,12,12,col,1);break;}}
}
function updateBoss(wdt){
  const B=C.boss;
  boss.t+=wdt;if(boss.flash>0)boss.flash-=wdt;
  boss.x+=(B.x-boss.x)*Math.min(1,1.2*wdt);
  boss.y=(C.ceil+C.floor-boss.h)/2+Math.sin(boss.t*0.8)*40;
  if(boss.x>B.x+10)return;   // still arriving
  if((boss.colT-=wdt)<=0){boss.colT=B.colEvery;mazeColumn();}
  // below half HP: also lob slow aimed orbs (these can be shot down)
  if(boss.hp<B.hp/2&&(boss.orbT-=wdt)<=0){boss.orbT=B.orbEvery;
    const cx=boss.x+62,cy=boss.y+boss.h/2,dx=p.x-cx,dy=p.y-cy,m=Math.hypot(dx,dy)||1;
    enemyShot(cx,cy,dx/m*B.orbSpeed,dy/m*B.orbSpeed,10,10,'#ff2bd6');}
}
// Drone: radial star burst, rotated randomly each volley
function starBurst(e){
  const n=e.pts,a0=Math.random()*6.283/n,s=C.drone.bulletSpeed,cx=e.x+e.w/2,cy=e.y+e.h/2;
  for(let i=0;i<n;i++){const a=a0+i*6.283/n;enemyShot(cx,cy,Math.cos(a)*s,Math.sin(a)*s,6,6,'#ff5555');}
}
// Brute: rushes to the player's height, then locks in place for a telegraphed burst of dashes
function updateBrute(e,wdt,d){
  const K=C.brute;
  if(e.dashLeft>0){if((e.dashT-=wdt)<=0){e.dashT=K.dashGap;e.dashLeft--;enemyShot(e.x-8,e.y+e.h/2,-K.dashSpeed,0,14,4,'#ff3b6b');}return;}
  if(e.windup>0){if((e.windup-=wdt)<=0){e.dashLeft=K.dashes;e.dashT=0;}return;}
  const m=K.trackSpeed*wdt;
  e.y+=clamp(clamp(p.y+C.playerH/2-e.h/2,C.ceil+4,C.floor-e.h-4)-e.y,-m,m);
  if((e.fireT-=wdt)<=0&&e.x<W-40){e.fireT=fireInterval(K,d);e.windup=K.windup;}
}
function updateEnemies(wdt,d){
  for(const e of enemies)if(e.on){
    e.t+=wdt;if(e.flash>0)e.flash-=wdt;
    if(e.leaving){e.lv=Math.min(C.leaveSpeed,(e.lv||0)+C.leaveAccel*wdt);e.x+=e.lv*wdt;if(e.x>W+40)e.on=false;continue;}  // retreating: accelerates away, no fire, still shootable
    e.x+=(e.tx-e.x)*Math.min(1,2.5*wdt);   // ease into the hover slot
    if(e.kind==='brute'){updateBrute(e,wdt,d);continue;}
    e.y=e.ty+Math.sin(e.t*2)*10;
    if((e.fireT-=wdt)<=0&&e.x<W-20){e.fireT=fireInterval(e.K,d);starBurst(e);}
  }
}
function moveEntities(dt,wdt,d){
  for(const b of bullets)if(b.on){b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x>W||b.y<0||b.y>H)b.on=false;}
  for(const e of ebullets)if(e.on){e.x+=e.vx*wdt;e.y+=e.vy*wdt;if(e.x<-20||e.x>W+10||e.y<0||e.y>H)e.on=false;}
  for(const q of towers)if(q.on){q.x-=speed*dt;
    // boss fight clears the field: towers retract into the ceiling and floor
    if(inBoss){q.gy-=C.boss.retract*dt;q.gh+=2*C.boss.retract*dt;if(q.gy<C.ceil-20&&q.gy+q.gh>C.floor+20)q.on=false;}
    if(q.x+C.towerW<-10)q.on=false;}
  updateEnemies(wdt,d);
  if(boss.on)updateBoss(wdt);
  const rad=has('magnet')?C.magnetRadius:SH().tractor||0,mag=rad>0,px=p.x+C.playerW/2,py=p.y+C.playerH/2;   // magnet card, or the ship's tractor beam
  const drift=-Math.max(speed*0.75,60),ws=has('slow')?C.slowFactor:1;   // minimum drift so boss drops still reach the player
  for(const c of cards)if(c.on){
    c.t+=dt;if(c.flash>0)c.flash-=dt;
    c.vx+=(drift-c.vx)*Math.min(1,C.cardDriftEase*dt);
    c.px=c.x;c.py=c.y;   // pre-move position, for swept collision against structures
    c.x+=c.vx*dt;c.y+=c.vy*dt;
    if(mag){const dx=px-c.x-C.cardW/2,dy=py-c.y-C.cardH/2,m=Math.hypot(dx,dy);
      if(m<rad&&m>1){const k=C.magnetPull*dt/m;c.x+=dx*k;c.y+=dy*k;}}
    // structures are solid: tower hulls (same hitbox as inTower) and the boss's indestructible maze blocks
    for(const q of towers)if(q.on){
      bounceCard(c,q.x,C.ceil-60,C.towerW,q.gy-C.ceil+60,-speed,0,dt);
      bounceCard(c,q.x,q.gy+q.gh,C.towerW,C.floor+60-q.gy-q.gh,-speed,0,dt);}
    for(const e of ebullets)if(e.on&&e.solid)bounceCard(c,e.x,e.y,e.w,e.h,e.vx*ws,e.vy*ws,dt);
    if(c.y<C.ceil+4){c.y=C.ceil+4;c.vy=c.vs;cardSpark(c);}
    else if(c.y+C.cardH>C.floor-4){c.y=C.floor-4-C.cardH;c.vy=-c.vs;cardSpark(c);}
    if(c.x<-C.cardW-10)c.on=false;
  }
}
// Push a card out of a (possibly moving) solid box and reflect its velocity relative to the box,
// so cards ricochet around structures like a bouncing screensaver logo. The hit face is the axis that
// was still separated last step (swept test), so the seams between maze blocks don't snag cards;
// if the card was already embedded, fall back to the shallowest axis.
function bounceCard(c,bx,by,bw,bh,ovx,ovy,dt){
  const w=C.cardW,h=C.cardH;
  if(!hit(c.x,c.y,w,h,bx,by,bw,bh))return;
  const l=c.x+w-bx,r=bx+bw-c.x,u=c.y+h-by,d=by+bh-c.y;
  const bx0=bx-ovx*dt,by0=by-ovy*dt,
    sepX=c.px+w<=bx0||c.px>=bx0+bw,sepY=c.py+h<=by0||c.py>=by0+bh;
  const horiz=sepX!==sepY?sepX:Math.min(l,r)<Math.min(u,d);
  if(horiz){
    if(l<r){c.x-=l;if(c.vx>ovx)c.vx=2*ovx-c.vx;}
    else{c.x+=r;if(c.vx<ovx)c.vx=2*ovx-c.vx;}
  }else if(u<d){c.y-=u;c.vy=Math.min(ovy,0)-c.vs;}
  else{c.y+=d;c.vy=Math.max(ovy,0)+c.vs;}
  cardSpark(c);
}
function cardSpark(c){   // flash + sparks on impact; suppressed while a card is pressed against a wall
  if(c.flash<=0)burst(c.x+C.cardW/2,c.y+C.cardH/2,CARDS[c.type].col,6,140);
  c.flash=0.15;
}
function updateParticles(dt){
  for(const q of parts)if(q.on){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.98;q.vy*=0.98;if((q.l-=dt)<=0)q.on=false;}
}

// ---- Collision & effects
function damage(e){
  const cx=e.x+e.w/2,cy=e.y+e.h/2;
  if(--e.hp>0){e.flash=0.08;burst(cx,cy,'#fff',4,120);return;}
  e.on=false;burst(cx,cy,e.kind==='brute'?'#ff3b6b':e.c,e.kind==='brute'?30:12,e.kind==='brute'?260:180);
  score+=e.K.score*(has('x2')?2:1);
  if(Math.random()<e.K.drop)spawnCard(e.x,e.y);
}
function damageBoss(x,y){
  const B=C.boss;boss.flash=0.06;burst(x,y,'#fff',3,120);boss.hp--;
  // drop a card at 2/3 and 1/3 HP
  if(boss.drops<2&&boss.hp<B.hp*(1-(boss.drops+1)/3)){boss.drops++;spawnCard(boss.x-60,rand(C.ceil+40,C.floor-100));}
  if(boss.hp>0)return;
  boss.on=false;bossDone=true;
  bossKills++;try{localStorage.setItem('voidRunnerBossKills',bossKills);}catch(e){}
  for(const S of SHIPS)if(S.need===bossKills){runUnlocks.push(S.name);unlockMsg='NEW SHIP UNLOCKED: '+S.name;unlockT=4;}
  for(let i=0;i<6;i++)burst(boss.x+rand(0,boss.w),boss.y+rand(0,boss.h),i&1?'#ff2bd6':'#ffd166',20,320);
  for(const e of ebullets)e.on=false;
  score+=B.score*(has('x2')?2:1);
}
function inTower(q,x,y,w,h){return x<q.x+C.towerW&&x+w>q.x&&(y<q.gy||y+h>q.gy+q.gh);}
// returns true if the player died
function hurt(){
  if(p.inv>0)return false;
  const cx=p.x+14,cy=p.y+8;
  if(p.shield)p.shield=false;
  else if(p.lives>0)p.lives--;
  else{die(cx,cy);return true;}
  p.inv=C.invulnTime;burst(cx,cy,'#4cc9f0',20,220);
  return false;
}
function die(x,y){
  state='over';overT=0;overSel=0;burst(x,y,'#ffd166',40,300);burst(x,y,'#ff4d6d',30,200);
  if(score>best){best=Math.floor(score);newBest=true;try{localStorage.setItem('voidRunnerBest',best);}catch(e){}}
}
function collect(c){
  c.on=false;const d=CARDS[c.type];
  score+=C.scoreCard*(has('x2')?2:1);
  burst(c.x+C.cardW/2,c.y+C.cardH/2,d.col,18,200);
  toast=d.name;toastT=1.2;
  if(d.k==='shield')p.shield=true;
  else if(d.k==='life')p.lives=1;   // single reserve life; duplicates only score
  else{
    // no stacking: a duplicate is removed and re-added fresh; over the cap, the oldest ends
    for(let i=0;i<timed.length;i++)if(timed[i].k===d.k){timed.splice(i,1);break;}
    if(timed.length>=C.maxTimed)timed.shift();
    timed.push({k:d.k,i:c.type,t:C.cardDur[d.k],m:C.cardDur[d.k]});
  }
}
function collide(){
  const PX=p.x+3,PY=p.y+2,PW=C.playerW-6,PH=C.playerH-4;
  for(const b of bullets){if(!b.on)continue;
    for(const q of towers)if(q.on&&inTower(q,b.x,b.y,10,3)){b.on=false;burst(b.x+8,b.y,q.neon,3,80);break;}
    if(!b.on)continue;
    for(const e of enemies)if(e.on&&hit(b.x,b.y,10,3,e.x,e.y,e.w,e.h)){b.on=false;damage(e);break;}
    if(!b.on)continue;
    if(boss.on&&hit(b.x,b.y,10,3,boss.x+20,boss.y,boss.w-20,boss.h)){b.on=false;damageBoss(b.x+10,b.y);continue;}
    for(const e of ebullets)if(e.on&&!e.solid&&hit(b.x,b.y,10,3,e.x,e.y,e.w,e.h)){b.on=e.on=false;burst(e.x+3,e.y+2,'#ff8080',5,100);break;}
  }
  for(const e of ebullets){if(!e.on)continue;
    if(hit(PX,PY,PW,PH,e.x,e.y,e.w,e.h)){e.on=false;if(hurt())return;continue;}
    for(const q of towers)if(q.on&&inTower(q,e.x,e.y,e.w,e.h)){e.on=false;break;}
  }
  for(const e of enemies)if(e.on&&hit(PX,PY,PW,PH,e.x,e.y,e.w,e.h)){if(e.kind==='drone')damage(e);if(hurt())return;}
  for(const q of towers)if(q.on&&inTower(q,PX,PY,PW,PH)&&hurt())return;
  if(boss.on&&hit(PX,PY,PW,PH,boss.x+20,boss.y,boss.w-20,boss.h)&&hurt())return;
  for(const c of cards)if(c.on&&hit(PX,PY,PW,PH,c.x,c.y,C.cardW,C.cardH))collect(c);
}

function update(dt){
  time+=dt;
  if(state==='pause')return;
  if(lockFlash>0)lockFlash-=dt;if(unlockT>0)unlockT-=dt;
  envT+=dt;if(envFade<1)envFade=Math.min(1,envFade+dt/C.envFade);if(envToastT>0)envToastT-=dt;
  updateStars(dt);updateParticles(dt);
  if(state==='intro'){updateIntro(dt);return;}
  if(state==='outro'){updateOutro(dt);return;}
  if(state==='over'){overT+=dt;return;}
  if(state!=='play')return;
  const d=Math.min(1,dist/C.rampDist),ws=has('slow')?C.slowFactor:1;
  flight+=((inBoss?0:1)-flight)*Math.min(1,1.2*dt);   // ease the scroll to a halt for the boss, back up after
  speed=lerp(C.speedStart,C.speedEnd,d)*ws*flight;
  dist+=speed*dt;score+=speed*dt*C.scorePerPx*(has('x2')?2:1);
  // advance levels by score; a boss level holds until the boss is defeated
  let li=level;while(li+1<C.levels.length&&score>=C.levels[li+1].score&&(C.levels[li].kind!=='boss'||bossDone))li++;
  if(li!==level){const L=C.levels[li];
    toast=(inBoss?'BOSS DEFEATED!  ':'')+'LEVEL '+(li+1)+': '+L.name;toastT=2.5;levelT=0;
    if(L.calm){enemyT=L.calm;firstPending=true;}else{enemyT=Math.min(enemyT,1.5);firstPending=false;}
    level=li;inBoss=L.kind==='boss';if(inBoss)startBoss();
    if(L.env!==envCur){envPrev=envCur;envCur=L.env;envFade=0;envToastT=3;}
    for(const e of enemies)if(e.on&&e.kind!==L.kind){e.leaving=true;e.lv=0;}}  // free the cap for the new kind
  updatePlayer(dt);if(state!=='play')return;
  levelT+=dt*ws*flight;
  updateTimed(dt);spawn(dt*ws*flight,d);moveEntities(dt,dt*ws,d);collide();
}

function drawSym(k,cx,cy,s,col){
  ctx.fillStyle=ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();
  switch(k){
    case 'rapid':for(let i=0;i<3;i++){const x=cx-s+i*s*0.65;ctx.moveTo(x,cy-s*0.6);ctx.lineTo(x+s*0.6,cy);ctx.lineTo(x,cy+s*0.6);}ctx.stroke();break;
    case 'shield':ctx.moveTo(cx,cy-s);ctx.lineTo(cx+s*0.85,cy-s*0.5);ctx.lineTo(cx+s*0.65,cy+s*0.4);ctx.lineTo(cx,cy+s);
      ctx.lineTo(cx-s*0.65,cy+s*0.4);ctx.lineTo(cx-s*0.85,cy-s*0.5);ctx.closePath();ctx.stroke();break;
    case 'double':ctx.moveTo(cx+s,cy-s*0.7);ctx.lineTo(cx-s,cy);ctx.lineTo(cx+s,cy+s*0.7);ctx.stroke();
      ctx.fillRect(cx+s-3,cy-s*0.7-2,4,4);ctx.fillRect(cx+s-3,cy+s*0.7-2,4,4);break;
    case 'slow':ctx.moveTo(cx-s*0.7,cy-s);ctx.lineTo(cx+s*0.7,cy-s);ctx.lineTo(cx-s*0.7,cy+s);ctx.lineTo(cx+s*0.7,cy+s);ctx.closePath();ctx.stroke();break;
    case 'magnet':ctx.lineWidth=3;ctx.arc(cx,cy,s*0.6,0,Math.PI);ctx.moveTo(cx+s*0.6,cy);ctx.lineTo(cx+s*0.6,cy-s*0.8);
      ctx.moveTo(cx-s*0.6,cy);ctx.lineTo(cx-s*0.6,cy-s*0.8);ctx.stroke();ctx.fillStyle='#fff';
      ctx.fillRect(cx+s*0.6-2,cy-s,4,4);ctx.fillRect(cx-s*0.6-2,cy-s,4,4);break;
    case 'x2':for(let i=0;i<10;i++){const r=i&1?s*0.45:s,a=i*Math.PI/5-Math.PI/2;ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}ctx.fill();break;

  }
}

  ctx.restore();
  const fl=t<0.12?1-t/0.12:Math.abs(t-OUT.crack)<0.15?1-Math.abs(t-OUT.crack)/0.15:0;   // impact flashes
  if(fl>0){ctx.fillStyle='rgba(255,255,255,'+fl*0.8+')';ctx.fillRect(0,0,W,H);}
  if(t>OUT.crack&&t<OUT.ready)text(TOUCH?'TAP to skip':'SPACE to skip',W-60,H-8,11,'#55597a');
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(sc,0,0,sc,ox,oy);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  if(envFade<1&&envPrev>=0)drawEnv(ENVS[envPrev],envT,1);
  drawEnv(ENVS[envCur],envT,envFade<1&&envPrev>=0?envFade:1);
  ctx.fillStyle='rgba(0,0,8,'+C.bgDim+')';ctx.fillRect(0,0,W,H);   // keep gameplay readable over the backdrop
  for(const L of LAYERS){ctx.fillStyle=L.c;for(let i=0;i<L.n;i++)ctx.fillRect(L.x[i],L.y[i],L.s,L.s);}
  if(envFade<1&&envPrev>=0){ctx.fillStyle=ENVS[envPrev].ground;ctx.fillRect(0,C.floor,W,H-C.floor);ctx.globalAlpha=envFade;}
  ctx.fillStyle=ENVS[envCur].ground;ctx.fillRect(0,C.floor,W,H-C.floor);ctx.globalAlpha=1;
  ctx.fillStyle='#ff2bd6';ctx.fillRect(0,C.floor,W,2);
  ctx.fillStyle='#00f0ff';ctx.fillRect(0,C.ceil-4,W,2);
  if(state==='play'||state==='pause'){const mg=has('magnet'),r=mg?C.magnetRadius:SH().tractor;
    if(r){ctx.strokeStyle=mg?'rgba(255,77,109,0.18)':'rgba(76,201,240,0.12)';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(p.x+14,p.y+8,r,0,6.283);ctx.stroke();}}
  for(const q of towers)if(q.on)drawTower(q);
  ctx.font='bold 9px monospace';ctx.textAlign='center';
  for(const c of cards)if(c.on)drawCard(c);
  for(const e of enemies)if(e.on){if(e.kind==='brute')drawBrute(e);else drawDrone(e);}
  ctx.fillStyle='#fff36b';for(const b of bullets)if(b.on)ctx.fillRect(b.x,b.y,10,3);
  for(const e of ebullets)if(e.on){ctx.fillStyle=e.c;ctx.fillRect(e.x,e.y,e.w,e.h);}
  if(boss.on)drawBoss();
  if(firstPending&&state==='play'&&enemyT<1.6&&(time*6|0)%2){   // telegraph the first arrival after a calm
    const wy=clamp(p.y+C.playerH/2,C.ceil+20,C.floor-20);ctx.fillStyle='#ff3b6b';
    for(let i=0;i<3;i++){const x=W-14-i*14;ctx.beginPath();ctx.moveTo(x,wy-9);ctx.lineTo(x-10,wy);ctx.lineTo(x,wy+9);ctx.fill();}
    text('INCOMING',W-60,wy-16,11,'#ff3b6b');}
  drawPlayer();
  for(const q of parts)if(q.on){ctx.globalAlpha=q.l/q.m;ctx.fillStyle=q.c;ctx.fillRect(q.x-1.5,q.y-1.5,3,3);}
  ctx.globalAlpha=1;
  if(has('slow')){ctx.fillStyle='rgba(179,136,255,0.07)';ctx.fillRect(0,C.ceil,W,C.floor-C.ceil);}
  if(state==='menu')drawMenu();
  else if(state==='hangar')drawHangar();
  else if(state==='intro')drawIntro();
  else if(state==='outro')drawOutro();
  else drawHUD();
  if(toastT>0&&state==='play'){ctx.globalAlpha=Math.min(1,toastT*2);text(toast,W/2,96,22,'#fff');ctx.globalAlpha=1;}
  if(envToastT>0&&state==='play'){const e=ENVS[envCur];ctx.globalAlpha=Math.min(1,envToastT*2);text('— '+e.name+' —',W/2,122,13,e.sun.c[1]);ctx.globalAlpha=1;}
  if(unlockT>0&&state==='play'){ctx.globalAlpha=Math.min(1,unlockT*2);text(unlockMsg,W/2,156,18,(time*6|0)%2?'#06d6a0':'#ffd166');ctx.globalAlpha=1;}
  if(state==='pause'){overlay([['PAUSED',H/2-10,44,'#fff'],[TOUCH?'TAP to resume':'P / ESC / SPACE to resume · M for menu',H/2+35,16,'#9aa0c8']]);
    button(PMENU_BTN,'MENU',false,'#9aa0c8');}
  else if(state==='over'){overlay([['GAME OVER',H/2-100,48,'#ff4d6d'],['SCORE '+Math.floor(score),H/2-45,24,'#fff'],
    ['BEST '+best,H/2-12,20,'#9aa0c8'],[newBest?'NEW BEST!':'',H/2+18,18,'#ffd166'],
    [runUnlocks.length?'NEW SHIP UNLOCKED: '+runUnlocks.join(', ')+' — visit the HANGAR':'',H/2+48,15,'#06d6a0']]);
    if(overT>0.6){button(RETRY_BTN,'RETRY',overSel===0,'#06d6a0');button(MENU_BTN,'MENU',overSel===1,'#06d6a0');
      if(!TOUCH)text('↑ ↓ choose · ENTER / SPACE select · ESC menu',W/2,H/2+176,12,'#55597a');}}
  ctx.restore();
}

// ---- Main loop: fixed-timestep simulation, render once per animation frame
let last=0,acc=0;
function frame(ts){
  const t=ts/1000,dt=last?Math.min(0.25,t-last):0;last=t;acc+=dt;
  while(acc>=STEP){update(STEP);acc-=STEP;}
  render();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
